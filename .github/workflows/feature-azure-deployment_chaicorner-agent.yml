# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - Chaicorner-Agent

on:
  push:
    branches:
      - feature/Azure-Deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required for checkout

    steps:
      - uses: actions/checkout@v4

      # --- Frontend build (same behavior as workflow 1) ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        run: |
          cd frontend
          echo "VITE_PAYPAL_CLIENT_ID=${{ secrets.VITE_PAYPAL_CLIENT_ID }}" >> .env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" >> .env
          npm ci
          npm run build
          cd ..
          rm -rf backend/static
          mkdir -p backend/static
          cp -R frontend/dist/* backend/static/

      # --- Vendor backend Python deps into .python_packages (like workflow 1) ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vendor backend dependencies
        run: |
          cd backend
          mkdir -p .python_packages/lib/site-packages
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target .python_packages/lib/site-packages
          cd ..
      - name: Show a few vendored packages
        run: |
          cd backend/.python_packages/lib/site-packages
          ls -1 | grep -E 'uvicorn|gunicorn|fastapi' || true

      # --- Zip ONLY the backend folder (like workflow 1) ---
      - name: Create deployment package
        run: |
          cd backend
          zip -r ../backend.zip .
          cd ..

      # --- Upload artifact for the deploy job ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for OIDC
      contents: read    # required for checkout (not strictly needed here)

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip

      # --- OIDC login (keep your existing auth model) ---
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B56E9E26D9048358674174937FD022A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_967124C4B47C42509D6C0E24B8D218A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DE3B00515B4D449FA9B8F112C117E18F }}

      # --- Deploy the same way as workflow 1 (zip push), but to your app/slot names ---
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Chaicorner-Agent'     # keep your app name
          slot-name: 'Production'          # keep your slot
          package: 'backend.zip'           # deploy ONLY the backend zip
